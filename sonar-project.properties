sonar.projectKey=zbalint_a2amx
sonar.organization=zbalint


# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=a2amx
#sonar.projectVersion=1.0


# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
#sonar.sources=.

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8

sonar.rust.lcov.reportPaths=lcov.info

# A failing quality gate fails the scan, so a red gate fails CI instead of showing only on the badge.
# The default wait of 300 s applies.
sonar.qualitygate.wait=true

# Test code needs no coverage. The OMP extension's coverage comes from the Node test run, which
# the wrapper tests/omp_extension.rs writes to js.lcov when A2AMX_JS_LCOV=js.lcov is set.
sonar.coverage.exclusions=tests/**
sonar.exclusions=.semgrep/**
sonar.javascript.lcov.reportPaths=js.lcov
