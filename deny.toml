# cargo-deny policy. Run by scripts/prepush-fast.sh and the CI deny job.

[advisories]
yanked = "deny"
unmaintained = "all"
# Add an entry only with a reason and a date, e.g.
# { id = "RUSTSEC-0000-0000", reason = "not reachable: ..." }  # 2026-01-01
ignore = []

[licenses]
# Exactly the licenses in Cargo.lock today; a new one fails the check until it is reviewed.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.93

# The crate's own AGPL-3.0-or-later is not an input to the dependency policy.
[licenses.private]
ignore = true

[bans]
# allow: a duplicate pulled in by two dependencies cannot be fixed from this crate, and the
# warnings would bury real output. Revisit if the duplicate count grows.
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
