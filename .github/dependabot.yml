version: 2
updates:
  # develop is the integration branch, so updates land there and reach master with a release.
  - package-ecosystem: cargo
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]
  # Actions are pinned by commit SHA; Dependabot updates the SHA and its version comment.
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        update-types: [minor, patch]
