name: Semgrep broad scan

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install semgrep
        env:
          SEMGREP_VERSION: 1.181.0
        run: pipx install "semgrep==${SEMGREP_VERSION}"
      - name: Scan
        env:
          SEMGREP_ENABLE_VERSION_CHECK: "0"
          SEMGREP_SEND_METRICS: "off"
        run: semgrep scan --config p/default --oss-only --metrics=off --disable-version-check --sarif --output semgrep.sarif
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: semgrep.sarif
          category: semgrep-broad
