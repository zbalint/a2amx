name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Full history so build.rs's `git describe` stamps the real version.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      # Reads the pinned channel and components from rust-toolchain.toml.
      - run: rustup toolchain install
      - run: rustup --version && cargo --version
      - uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2.7.5
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      # --no-fail-fast: one timing flake must not hide the suites after it.
      - run: cargo test --locked --no-fail-fast
