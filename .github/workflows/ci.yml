name: ci

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Full history so build.rs's `git describe` stamps the real version and SonarQube can blame.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      # Reads the pinned channel and components from rust-toolchain.toml.
      - run: rustup toolchain install
      - run: rustup component add llvm-tools-preview
      - run: rustup --version && cargo --version
      - uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2.7.5
      - run: cargo install --locked cargo-llvm-cov --version 0.9.1
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      # The test run doubles as the coverage run. continue-on-error lets the SonarQube scan still
      # see the report; the last step fails the job when the tests failed.
      # --no-fail-fast: one timing flake must not hide the suites after it.
      - name: Test with coverage
        id: tests
        continue-on-error: true
        run: cargo llvm-cov --locked --no-fail-fast --no-report
      # A test that kills a child mid-write leaves a truncated .profraw that crashes llvm-profdata,
      # so drop the unreadable ones before building the report.
      - name: Coverage report
        run: |
          profdata="$(rustc --print sysroot)/lib/rustlib/x86_64-unknown-linux-gnu/bin/llvm-profdata"
          for f in target/llvm-cov-target/*.profraw; do
            "$profdata" merge -sparse "$f" -o /dev/null >/dev/null 2>&1 || { echo "dropping unreadable $f"; rm -f "$f"; }
          done
          cargo llvm-cov report --lcov --output-path lcov.info
      - name: Cache SonarQube packages
        if: github.ref_name == 'master' || github.ref_name == 'develop' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      # Skipped on other branches and on fork pull requests, which have no SONAR_TOKEN.
      - name: SonarQube Scan
        if: github.ref_name == 'master' || github.ref_name == 'develop' || github.event.pull_request.head.repo.full_name == github.repository
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Fail when the tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1
