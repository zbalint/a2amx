name: release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  release:
    # shortcut: oldest supported runner keeps glibc at 2.35; upgrade when GitHub retires it.
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          BASE="${TAG#v}"
          BASE="${BASE%%-*}"
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml)"
          test "$BASE" = "$version"
          git merge-base --is-ancestor HEAD origin/master
          awk -v heading="## [$BASE]" '
            $0 == heading || index($0, heading " ") == 1 { section = 1; next }
            section && /^## / { exit }
            section && /[^[:space:]]/ { nonblank = 1 }
            END { exit !nonblank }
          ' CHANGELOG.md
      - name: Install Rust toolchain
        env:
          TAG: ${{ github.ref_name }}
        run: rustup toolchain install
      - name: Build release binary
        env:
          TAG: ${{ github.ref_name }}
        run: cargo build --release --locked
      - name: Package release binary
        env:
          TAG: ${{ github.ref_name }}
        run: |
          package="a2amx-$TAG-x86_64-unknown-linux-gnu"
          test "$(cd target/release && ./a2amx --version)" = "a2amx $TAG"
          mkdir "$package"
          cp target/release/a2amx LICENSE README.md "$package/"
          tar -czf "$package.tar.gz" "$package/"
          sha256sum "$package.tar.gz" > SHA256SUMS
      - name: Extract release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          BASE="${TAG#v}"
          BASE="${BASE%%-*}"
          awk -v heading="## [$BASE]" '
            $0 == heading || index($0, heading " ") == 1 { section = 1; next }
            section && /^## / { exit }
            section { print }
          ' CHANGELOG.md > notes.md
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Sign release assets
        env:
          TAG: ${{ github.ref_name }}
        run: |
          archive="a2amx-$TAG-x86_64-unknown-linux-gnu.tar.gz"
          cosign sign-blob --yes --bundle "$archive.sigstore.json" "$archive"
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: a2amx-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz
      - name: Publish release
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="a2amx-$TAG-x86_64-unknown-linux-gnu.tar.gz"
          flags=()
          if [[ "$TAG" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md \
            "${flags[@]}" "$archive" SHA256SUMS "$archive.sigstore.json" SHA256SUMS.sigstore.json
