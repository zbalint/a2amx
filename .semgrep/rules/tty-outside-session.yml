rules:
  - id: tty-outside-session
    languages: [rust]
    severity: ERROR
    message: The alacritty PTY module belongs only in src/session.rs; use the session boundary elsewhere.
    metadata:
      source: AGENTS.md
    pattern-regex: '\balacritty_terminal::tty\b'
    paths:
      exclude: ["src/session.rs"]
